name: Research Factory replacement quality gates

on:
  push:
    branches:
      - "feat/independent-research-factory-rebuild"
    paths:
      - "apps/web/**"
      - "frontend/src/lib/**"
      - "docs/independent-rebuild-*.md"
      - ".github/workflows/research-factory-web.yml"
  workflow_dispatch:
permissions:
  contents: read

concurrency:
  group: research-factory-web-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  replacement-web:
    name: Replacement app tests, audit and production build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Install root dependencies
        run: npm ci

      - name: Install legacy frontend dependencies for the temporary data bridge
        run: npm --prefix frontend ci

      - name: Install replacement app dependencies
        working-directory: apps/web
        run: npm install --no-audit --no-fund

      - name: Upload generated app lockfile for deterministic dependency pinning
        uses: actions/upload-artifact@v4
        with:
          name: research-factory-web-package-lock
          path: apps/web/package-lock.json
          if-no-files-found: error
          retention-days: 3

      - name: Audit replacement app dependencies
        working-directory: apps/web
        run: npm audit --audit-level=high

      - name: Run replacement app typecheck, tests and build
        working-directory: apps/web
        run: npm run build

      - name: Install Chromium for browser tests
        working-directory: apps/web
        run: npx playwright install --with-deps chromium

      - name: Run browser, responsive and accessibility tests
        working-directory: apps/web
        run: npm run test:e2e

      - name: Run existing repository regression suite
        run: npm run test:regression
