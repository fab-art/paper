name: Frontend build
on:
  pull_request:
  push:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install root dependencies
        run: npm install
      - name: Install frontend dependencies
        run: npm --prefix frontend install
      - name: Apply compatible dependency security fixes
        continue-on-error: true
        run: |
          npm audit fix || true
          npm --prefix frontend audit fix || true
      - name: Dependency vulnerability summary
        continue-on-error: true
        run: |
          npm audit --json > /tmp/root-audit.json || true
          npm --prefix frontend audit --json > /tmp/frontend-audit.json || true
          node --input-type=module <<'NODE'
          import fs from "node:fs";
          for (const [label, file] of [["root", "/tmp/root-audit.json"], ["frontend", "/tmp/frontend-audit.json"]]) {
            let report;
            try { report = JSON.parse(fs.readFileSync(file, "utf8")); }
            catch { console.log(label + ": audit report unavailable"); continue; }
            const summary = report.metadata?.vulnerabilities || {};
            console.log(label + " audit summary: " + JSON.stringify(summary));
            for (const [name, item] of Object.entries(report.vulnerabilities || {})) {
              const advisories = (item.via || []).map(value => typeof value === "string" ? value : value.title).join("; ");
              console.log([name, "severity=" + item.severity, "direct=" + item.isDirect, "range=" + item.range, "fix=" + JSON.stringify(item.fixAvailable), "via=" + advisories].join(" | "));
            }
          }
          NODE
      - name: Upload generated npm lockfiles
        uses: actions/upload-artifact@v4
        with:
          name: paperorchestra-npm-lockfiles
          path: |
            package-lock.json
            frontend/package-lock.json
          if-no-files-found: error
      - name: Regression tests
        run: npm run test:regression
      - name: Typecheck and build
        run: npm --prefix frontend run build
      - name: Commit audited lockfiles to same-repository PR branch
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        run: |
          cp package-lock.json /tmp/paperorchestra-root-package-lock.json
          cp frontend/package-lock.json /tmp/paperorchestra-frontend-package-lock.json
          git fetch origin "$GITHUB_HEAD_REF"
          git checkout -B "$GITHUB_HEAD_REF" FETCH_HEAD
          cp /tmp/paperorchestra-root-package-lock.json package-lock.json
          cp /tmp/paperorchestra-frontend-package-lock.json frontend/package-lock.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json frontend/package-lock.json
          if git diff --cached --quiet; then
            echo "Dependency lockfiles are already up to date."
            exit 0
          fi
          git commit -m "chore: commit audited npm lockfiles"
          git push origin "HEAD:$GITHUB_HEAD_REF"
