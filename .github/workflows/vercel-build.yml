name: Frontend build
on:
  pull_request:
  push:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install root dependencies
        run: npm install
      - name: Install frontend dependencies
        run: npm --prefix frontend install
      - name: Dependency vulnerability summary
        continue-on-error: true
        run: |
          npm audit --json > /tmp/root-audit.json || true
          npm --prefix frontend audit --json > /tmp/frontend-audit.json || true
          node --input-type=module <<'NODE'
          import fs from "node:fs";
          for (const [label, file] of [["root", "/tmp/root-audit.json"], ["frontend", "/tmp/frontend-audit.json"]]) {
            let report;
            try { report = JSON.parse(fs.readFileSync(file, "utf8")); }
            catch { console.log(label + ": audit report unavailable"); continue; }
            const summary = report.metadata?.vulnerabilities || {};
            console.log(label + " audit summary: " + JSON.stringify(summary));
            for (const [name, item] of Object.entries(report.vulnerabilities || {})) {
              const advisories = (item.via || []).map(value => typeof value === "string" ? value : value.title).join("; ");
              console.log([name, "severity=" + item.severity, "direct=" + item.isDirect, "range=" + item.range, "fix=" + JSON.stringify(item.fixAvailable), "via=" + advisories].join(" | "));
            }
          }
          NODE
      - name: Regression tests
        run: npm run test:regression
      - name: Typecheck and build
        run: npm --prefix frontend run build
