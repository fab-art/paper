name: Phase 9 lockfile sync

on:
  push:
    branches:
      - feat/lumen-system-redesign-phase9

permissions:
  contents: write

jobs:
  sync-lockfile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Regenerate the exact frontend lockfile
        run: npm --prefix frontend install --package-lock-only --ignore-scripts
      - name: Commit the lockfile if it changed
        run: |
          if ! git diff --quiet -- frontend/package-lock.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add frontend/package-lock.json
            git commit -m "chore(deps): sync Phase 9 Lumen lockfile"
            git push
          fi
